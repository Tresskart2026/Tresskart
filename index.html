
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TressKart | Premium Human Hair</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf8f4;
      color: #211d18;
    }
    header {
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid #e7e0d6;
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }
    .logo span { color: #b69a65; }
    nav { margin-top: 18px; }
    nav a {
      margin: 0 12px;
      text-decoration: none;
      color: #211d18;
      font-size: 13px;
    }
    .hero {
      padding: 85px 24px;
      text-align: center;
      background: #eee8dd;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 48px;
      font-weight: normal;
    }
    h1 em { color: #ad8d59; }
    .hero p { line-height: 1.7; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 28px;
      background: #211d18;
      color: white;
      text-decoration: none;
      font-size: 13px;
    }
    .section {
      padding: 55px 20px;
      text-align: center;
    }
    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      max-width: 850px;
      margin: 30px auto;
    }
    .category {
      padding: 55px 12px;
      background: #e5d8c5;
      text-decoration: none;
      color: #211d18;
    }
    .category:nth-child(2) {
      background: #c8b8a1;
    }
    footer {
      background: #211d18;
      color: white;
      text-align: center;
      padding: 35px;
    }
    @media(max-width: 500px) {
      .categories { grid-template-columns: 1fr; }
      h1 { font-size: 40px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">TRESS<span>KART</span></div>
  <nav>
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero" id="home">
  <p>PREMIUM HUMAN HAIR</p>
  <h1>Real Hair.<br><em>Real Beauty.</em></h1>
  <p>Discover beautiful, quality human hair.</p>
  <a class="btn" href="#shop">EXPLORE COLLECTION</a>
</section>

<section class="section" id="shop">
  <p>OUR COLLECTION</p>
  <h1>Shop by Category</h1>
  <div class="categories">
    <a class="category" href="#shop">
      <h2>Loose Hair</h2>
      <p>Explore Collection</p>
    </a>
    <a class="category" href="#shop">
      <h2>Hair Bundles</h2>
      <p>Explore Collection</p>
    </a>
  </div>
</section>

<footer id="contact">
  <h2>TRESSKART</h2>
  <p>Real Hair. Real Beauty.</p>
  <p>© 2026 TressKart</p>
</footer>

</body>
                 </html>
